version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: wblync-app
    working_dir: /var/www
    restart: unless-stopped

    environment:
      TZ: Asia/Kuala_Lumpur

    volumes:
      - ./src:/var/www

    depends_on:
      - mysql

    networks:
      - wblync-network

  nginx:
    image: nginx:latest
    container_name: wblync-nginx
    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - wblync-network

  mysql:
    image: mysql:8.4
    container_name: wblync-mysql
    restart: unless-stopped

    environment:
      TZ: Asia/Kuala_Lumpur
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dbwblync
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    command: >
      --default-time-zone=+08:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

    ports:
      - "3308:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10

    networks:
      - wblync-network

volumes:
  mysql-data:

networks:
  wblync-network:
    driver: bridge