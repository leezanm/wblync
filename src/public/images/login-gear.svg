<svg viewBox="0 0 360 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">WBLync login illustration</title>
  <desc id="desc">An isometric platform illustration with stacked disks and decorative gears.</desc>
  <defs>
    <style>
      .wb-core-shadow { opacity: 0.18; fill: #071d5a; }
      .wb-chip-line { stroke: rgba(147, 197, 253, 0.5); stroke-width: 4; stroke-linecap: round; fill: none; }
      .wb-chip-node { fill: #60a5fa; opacity: 0.7; }
      .wb-platform-top { fill: url(#wbPlatformTop); }
      .wb-platform-side { fill: url(#wbPlatformSide); }
      .wb-platform-front { fill: url(#wbPlatformFront); }
      .wb-base-top { fill: url(#wbBaseTop); }
      .wb-base-side { fill: url(#wbBaseSide); }
      .wb-base-front { fill: url(#wbBaseFront); }
      .wb-disk-top { fill: url(#wbDiskTop); }
      .wb-disk-front { fill: url(#wbDiskFront); }
      .wb-disk-highlight { fill: none; stroke: rgba(255, 255, 255, 0.32); stroke-width: 5; }
      .wb-pillar { fill: url(#wbPillar); }
      .wb-orbit { fill: none; stroke: rgba(125, 211, 252, 0.85); stroke-width: 8; }
      .wb-orbit-core { fill: url(#wbOrbitCore); }
      .wb-gear-large { fill: url(#wbGearLarge); }
      .wb-gear-small { fill: url(#wbGearSmall); }
    </style>
    <linearGradient id="wbPlatformTop" x1="90" y1="140" x2="180" y2="210" gradientUnits="userSpaceOnUse">
